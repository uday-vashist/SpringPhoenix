# ─── Integration-test profile ──────────────────────────────────────────────────
# Uses H2 in-memory in MySQL-compatibility mode so SQL behaviour closely matches
# a real relational database (type coercion, constraints, etc.).
# Each test-class gets a fresh schema via create-drop DDL.

spring.datasource.url=jdbc:h2:mem:integrationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable the open-session-in-view anti-pattern
spring.jpa.open-in-view=false

# Keep Hibernate logging quiet during tests
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
